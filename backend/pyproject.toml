[project]
name = "ia-gateway"
version = "0.1.0"
description = "Backend que conecta un chat flotante con un LLM local (Ollama)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pytesseract>=0.3.13",
    "pillow>=11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ia_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not ollama and not tesseract'"
markers = [
    "ollama: pruebas contra un servidor Ollama real (excluidas por defecto)",
    "tesseract: pruebas contra Tesseract real (excluidas por defecto)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
